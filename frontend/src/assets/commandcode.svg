  Command Code 官方符号（单色、随主题）—— ProviderIcon 的第三类资产：lobe 里没有这家。

  来源：github.com/CommandCodeAI/command-code 的 .github/commandcode/symbols/commandcode.svg
  （@ a459b35，2026-10-14 取）。官方原件是三件套「黑色圆角方块 + 反白 ⌘ 字形」，这里只留
  字形本身——其余提供方的图标都是裸字形，带容器方块会在一列图标里显得像另一个应用；
  fill 由 #000 换成 currentColor 跟随主题，viewBox 收到字形自己的外框（原件 137 见方里
  字形占 26.178–110.822，留白会让它在 18px 下比邻居小一圈）。
-->
