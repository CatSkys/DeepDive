<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSHmini</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener("error", (e) => {
        fetch("/__dshmini_error", {
          method: "POST",
          body: String(e.message || "") + "\n" + String(e.filename || "") + ":" + String(e.lineno || ""),
        }).catch(() => {});
      });
      window.addEventListener("unhandledrejection", (e) => {
        fetch("/__dshmini_error", {
          method: "POST",
          body: "rejection: " + String((e.reason && e.reason.stack) || e.reason),
        }).catch(() => {});
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
