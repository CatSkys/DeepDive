<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepDive — 实心 D（右侧渐变模糊）候选集 v1</title>
<style>
  :root { --bg:#17181b; --ink:#e9e7e1; --dim:#98958d; --line:#37393f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:1560px; margin:0 auto; padding:40px 32px 90px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.3px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  h2 { font-size:15px; font-weight:600; margin:44px 0 14px; }
  .tools { display:flex; gap:12px; margin:0 0 26px; }
  button { background:#24262b; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:#2d2f35; }
  .row { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-end; }
  .board svg { display:block; border-radius:14px; box-shadow:0 0 0 1px var(--line); }
  .cap { margin-top:10px; color:var(--dim); font-size:12.5px; max-width:452px; }
  .cap b { color:var(--ink); font-weight:600; }
  .ladder { display:flex; gap:20px; align-items:flex-end; }
  .ladder .cell { text-align:center; }
  .ladder svg { display:block; border-radius:4px; box-shadow:0 0 0 1px var(--line); }
  .ladder .lb { margin-top:8px; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>DeepDive — 实心 D（右侧渐变模糊）候选集 v1</h1>
  <div class="sub">白底 <span style="color:#fff">#FFFFFF</span> · 实心 D <span style="color:#c8c6c0">#0b0b0c</span> · 右侧横向渐进模糊 · 纯矢量确定性渲染</div>
  <div class="tools">
    <button onclick="exportAllPNG()">⬇ 导出全部 PNG</button>
    <button onclick="exportAllSVG()">⬇ 导出全部 SVG</button>
  </div>

  <h2 style="margin-top:0">变体对比（同一 1024 画布，导出资产即此）</h2>
  <div class="row" id="markRow"></div>

  <h2>尺寸阶梯（基准变体，同配方重渲染）</h2>
  <div class="ladder" id="ladderRow"></div>
</div>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const CANVAS = 1024;         // 逻辑画布（viewBox 边长）
const PAPER = '#ffffff';
const INK = '#0b0b0c';

/* ---------------- 配方常量：改这里即改全部产物 ---------------- */
const FIT = 0.72;            // D 高 = 画布 72%
const W_OVER_H = 0.977;      // 宽/高：柄 0.477 +（半径 = 高/2 的）右半圆
const EYE_SIGMA = 1.5;       // 定位：视觉外框右界 = 实心右缘 + 1.5σ
const BLUR_STEPS = [0.20, 0.45, 0.70, 1.00];                              // 各级 σ / σmax
/* 各级蒙版区间（相对 from，按实心宽度归一）：依次淡入、用完淡出、互不叠加。
   叠加会把边缘重新叠硬——每级在实心右缘都贡献 50%，合成后 1-0.5⁴≈0.94，
   而参考图该处是 0.50；所以同一时刻只让一级（最强的那级）主导边缘。 */
const LAYER_MASKS = [
  { in: [-0.06, 0.02], out: [0.20, 0.32] },
  { in: [0.12, 0.20], out: [0.42, 0.54] },
  { in: [0.32, 0.40], out: [0.48, 0.56] },
  { in: [0.44, 0.52], out: null },        // 最外一级留到最后，负责尾巴
];
const CRISP_FADE = [0.02, 0.16];          // 实心层淡出区间
const LADDER = [512, 256, 128, 64, 32, 16];
const PREVIEW = 452;

/* 三档模糊强度：sigma = σmax / 高，from = 起模糊处 / 实心宽度 */
const VARIANTS = {
  fade: { title: '基准 · 渐变模糊', note: '照参考图配方：σ 0.055H，0.42W 起糊', sigma: 0.055, from: 0.42 },
  'fade-soft': { title: '柔 · 更宽模糊', note: 'σ 0.075H，0.34W 起糊，右缘化得更开', sigma: 0.075, from: 0.34 },
  'fade-tight': { title: '紧 · 更收模糊', note: 'σ 0.032H，0.55W 起糊，D 读起来更硬', sigma: 0.032, from: 0.55 },
};

const r2 = (n) => Math.round(n * 100) / 100;

const el = (name, attrs) => {
  const e = document.createElementNS(SVGNS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

/* 实心 D：左边矩形柄 + 右侧半圆（半径 = 高/2），无字腔 */
function dPath(xL, yT, w, h) {
  const rad = h / 2, cx = xL + w - rad;
  return `M ${r2(xL)} ${r2(yT)} L ${r2(cx)} ${r2(yT)}`
    + ` A ${r2(rad)} ${r2(rad)} 0 0 1 ${r2(cx)} ${r2(yT + h)}`
    + ` L ${r2(xL)} ${r2(yT + h)} Z`;
}

function geom(v) {
  const h = CANVAS * FIT, w = h * W_OVER_H, sigma = v.sigma * h;
  return { xL: (CANVAS - (w + EYE_SIGMA * sigma)) / 2, yT: (CANVAS - h) / 2, w, h, sigma };
}

function markSVG(id, size) {
  const v = VARIANTS[id], g = geom(v), d = dPath(g.xL, g.yT, g.w, g.h);
  const svg = el('svg', { xmlns: SVGNS, width: size, height: size, viewBox: `0 0 ${CANVAS} ${CANVAS}` });
  const defs = el('defs');
  let n = 0;

  /* 横向蒙版：按 [[u, opacity], …] 逐点插值（u 按实心宽度归一），两端按端点值延伸。
     蒙版区域显式覆盖整幅画布——默认区域按元素 bbox 取，会把模糊外溢裁掉。 */
  const maskOf = (points) => {
    const gid = `g${++n}`, mid = `m${n}`;
    const u0 = points[0][0], u1 = points[points.length - 1][0];
    const grad = el('linearGradient', { id: gid, gradientUnits: 'userSpaceOnUse',
      x1: r2(g.xL + u0 * g.w), y1: 0, x2: r2(g.xL + u1 * g.w), y2: 0 });
    for (const [u, op] of points) {
      grad.appendChild(el('stop', {
        offset: r2((u - u0) / (u1 - u0)), 'stop-color': '#fff', 'stop-opacity': op,
      }));
    }
    defs.appendChild(grad);
    const mask = el('mask', { id: mid, maskUnits: 'userSpaceOnUse',
      x: 0, y: 0, width: CANVAS, height: CANVAS });
    mask.appendChild(el('rect', { x: 0, y: 0, width: CANVAS, height: CANVAS, fill: `url(#${gid})` }));
    defs.appendChild(mask);
    return mid;
  };

  /* 滤镜区域同样显式覆盖整幅画布，否则模糊外溢被 bbox 区域裁断 */
  const filterOf = (sigma) => {
    const fid = `b${++n}`;
    const f = el('filter', { id: fid, filterUnits: 'userSpaceOnUse',
      x: 0, y: 0, width: CANVAS, height: CANVAS });
    f.appendChild(el('feGaussianBlur', { stdDeviation: r2(sigma) }));
    defs.appendChild(f);
    return fid;
  };

  const layer = (maskId, filterId) => {
    const grp = el('g', { mask: `url(#${maskId})` });
    if (filterId) grp.setAttribute('filter', `url(#${filterId})`);
    grp.appendChild(el('path', { d, fill: INK }));
    return grp;
  };

  svg.appendChild(el('rect', { x: 0, y: 0, width: CANVAS, height: CANVAS, fill: PAPER }));
  svg.appendChild(defs);
  svg.appendChild(layer(maskOf([[v.from + CRISP_FADE[0], 1], [v.from + CRISP_FADE[1], 0]]), null));
  BLUR_STEPS.forEach((k, i) => {
    const m = LAYER_MASKS[i];
    const stops = [[v.from + m.in[0], 0], [v.from + m.in[1], 1]];
    if (m.out) stops.push([v.from + m.out[0], 1], [v.from + m.out[1], 0]);
    svg.appendChild(layer(maskOf(stops), filterOf(g.sigma * k)));
  });
  return svg;
}

/* ---------------- 导出 ---------------- */
const svgText = (svg) => '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg) + '\n';

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportPNG(id, size) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    cv.getContext('2d').drawImage(img, 0, 0, size, size);
    cv.toBlob((blob) => download(blob, `deepdive-d-${id}-${size}.png`), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText(markSVG(id, size)));
}

function exportSVG(id) {
  download(new Blob([svgText(markSVG(id, CANVAS))], { type: 'image/svg+xml' }), `deepdive-d-${id}.svg`);
}

function exportAllPNG() {
  let i = 0;
  for (const id of Object.keys(VARIANTS)) {
    for (const s of (id === 'fade' ? [CANVAS, ...LADDER] : [CANVAS])) {
      setTimeout(() => exportPNG(id, s), 150 * i++);
    }
  }
}

function exportAllSVG() {
  Object.keys(VARIANTS).forEach((id, i) => setTimeout(() => exportSVG(id), 150 * i));
}

/* ---------------- 页面组装 ---------------- */
function tile(parent, svg, caption) {
  const d = document.createElement('div');
  d.className = 'board';
  svg.style.width = PREVIEW + 'px';
  svg.style.height = PREVIEW + 'px';
  d.appendChild(svg);
  const c = document.createElement('div');
  c.className = 'cap';
  c.innerHTML = caption;
  d.appendChild(c);
  parent.appendChild(d);
}

function renderBoard() {
  const markRow = document.getElementById('markRow');
  for (const id of Object.keys(VARIANTS)) {
    tile(markRow, markSVG(id, PREVIEW), `<b>${VARIANTS[id].title}</b> — ${VARIANTS[id].note}`);
  }
  const ladderRow = document.getElementById('ladderRow');
  for (const s of LADDER) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const svg = markSVG('fade', s);
    svg.style.width = s + 'px';
    svg.style.height = s + 'px';
    cell.appendChild(svg);
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.textContent = s + 'px';
    cell.appendChild(lb);
    ladderRow.appendChild(cell);
  }
}

/* 单标模式（无头渲染用）：?mark=<变体>[&size=<边长>]，整页只有该标记，截图即产物 */
const q = new URLSearchParams(location.search);
const singleId = q.get('mark');
if (singleId && VARIANTS[singleId]) {
  document.getElementById('wrap').remove();
  const svg = markSVG(singleId, Number(q.get('size')) || CANVAS);
  svg.style.display = 'block';
  document.body.style.margin = '0';
  document.body.style.background = 'transparent';
  document.body.appendChild(svg);
} else {
  renderBoard();
}
</script>
</body>
</html>
