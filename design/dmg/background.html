<!doctype html>
<!-- DMG 窗口背景：唯一事实源（生成 1x/2x PNG，打包时 tiffutil 合成 HiDPI TIFF）。
     浅底黑字：DMG 窗口不跟随系统外观，暗底图在浅色模式里会跳，用户定稿用浅色。
     图里只画"引导"——两个图标位置留空，由 Finder 画真实图标：
       DeepDive.app 在 (170, 210)，Applications 在 (490, 210)（Finder 会把 y 抬到 255
     下界，箭头按实测中心 255 画），画布 660×420。
     改尺寸/位置时三处必须同步：本文件的 --w/--h 与两处 icon 坐标、
     package-macos.sh 里的窗口 bounds 与 AppleScript 的 position。 -->
<html lang="zh"><head><meta charset="utf-8"><style>
  :root { --w: 660px; --h: 420px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: var(--w); height: var(--h); overflow: hidden;
         background: #F4F4F6;
         font-family: "PingFang SC", "Helvetica Neue", sans-serif;
         -webkit-font-smoothing: antialiased; }
  .bg { position: absolute; inset: 0;
        background: linear-gradient(180deg, #FDFDFE 0%, #F2F2F5 100%); }
  .title { position: absolute; top: 54px; width: 100%; text-align: center;
           font-size: 22px; font-weight: 500; letter-spacing: .2px; color: #111114; }
  .sub { position: absolute; top: 88px; width: 100%; text-align: center;
         font-size: 13px; color: #6A6A73; }
  .arrow { position: absolute; left: 250px; top: 254px; width: 160px; height: 2px;
           background: linear-gradient(90deg, rgba(0,0,0,.14), rgba(0,0,0,.40)); }
  .arrow::after { content: ""; position: absolute; right: -1px; top: -5px;
                  border-left: 9px solid rgba(0,0,0,.40);
                  border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .foot { position: absolute; bottom: 62px; width: 100%; text-align: center;
          font-size: 11.5px; color: #8A8A93; }
</style></head><body>
  <div class="bg"></div>
  <div class="title">把 DeepDive 拖入「应用程序」</div>
  <div class="sub">拷贝完成后，在「启动台」或「应用程序」里打开即可</div>
  <div class="arrow"></div>
  <div class="foot">需要 macOS 14 或更高版本 · 仅支持 Apple 芯片（M 系列）的 Mac</div>
</body></html>
