<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepDive — Logo 生成器（实心 D · 右侧渐变模糊）</title>
<style>
  :root { --bg:#17181b; --ink:#e9e7e1; --dim:#98958d; --line:#37393f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:1560px; margin:0 auto; padding:40px 32px 90px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.3px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  h2 { font-size:15px; font-weight:600; margin:44px 0 14px; }
  .tools { display:flex; gap:12px; margin:0 0 26px; }
  button { background:#24262b; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:#2d2f35; }
  .row { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-end; }
  .board canvas { display:block; border-radius:14px; box-shadow:0 0 0 1px var(--line); }
  .board.checker canvas { background:repeating-conic-gradient(#2a2c31 0 25%, #202226 0 50%) 0 0/16px 16px; }
  .cap { margin-top:10px; color:var(--dim); font-size:12.5px; max-width:452px; }
  .cap b { color:var(--ink); font-weight:600; }
  .ladder { display:flex; gap:20px; align-items:flex-end; }
  .ladder .cell { text-align:center; }
  .ladder canvas { display:block; border-radius:4px; box-shadow:0 0 0 1px var(--line); }
  .ladder .lb { margin-top:8px; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>DeepDive — Logo 生成器</h1>
  <div class="sub">实心 D + 右侧渐变模糊 · 白底 <span style="color:#fff">#FFFFFF</span> · 墨 <span style="color:#c8c6c0">#0b0b0c</span> · 逐像素连续 σ 场 + 8×8 拜耳抖动（确定性）</div>
  <div class="tools">
    <button onclick="exportAll()">⬇ 导出全部 PNG</button>
  </div>

  <h2 style="margin-top:0">主 Logo（白底方版，导出资产即此）</h2>
  <div class="row" id="markRow"></div>

  <h2>图标（AppIcon 母版 / 小尺寸剪影版）</h2>
  <div class="row" id="iconRow"></div>

  <h2>尺寸阶梯（主 Logo，同配方重渲染）</h2>
  <div class="ladder" id="ladderRow"></div>
</div>

<script>
'use strict';

/* 逐像素渲染连续 σ 场：不用 SVG 滤镜叠加近似——分级 σ 在级间与 8-bit 量化上都
   出伪影（条带接缝 + 等墨度色带）。墨量 = Φ(−到 D 的符号距离 / σ(x))。 */
const CANVAS = 1024;
const INK_GRAY = 11;         // #0b0b0c

/* ---------------- 配方常量：改这里即改全部产物 ---------------- */
const FIT = 0.72;            // D 高 = 画布 72%
const W_OVER_H = 0.977;      // 宽/高：柄 0.477 +（半径 = 高/2 的）右半圆
const CORNER_R = 0.10;       // 左侧两角圆角 = 高 10%
const EYE_SIGMA = 1.5;       // 定位：视觉外框右界 = 实心右缘 + 1.5σ
const RAMP_TO = 1.05;        // σ 涨到 σmax 处（实心宽度归一），其外 σ 恒为 σmax
const SMALL_FIT = 0.66;      // 小尺寸图标里 D 高 / 画布（16/32 槽位用，渐变在极小尺寸会糊）
const LADDER = [512, 256, 128, 64, 32, 16];
const PREVIEW = 452;

/* 模糊强度：sigmaEdge = 实心右缘（u=1）处的 σ / 高，from = 起模糊处 / 实心宽度 */
const MARK = { sigmaEdge: 0.055, from: 0.42 };

function geom(v, S = CANVAS) {
  const h = S * FIT, w = h * W_OVER_H;
  const sigmaEdge = v.sigmaEdge * h;
  const sigmaMax = sigmaEdge * (RAMP_TO - v.from) / (1 - v.from);
  const xL = (S - (w + EYE_SIGMA * sigmaEdge)) / 2;
  const yT = (S - h) / 2;
  return { S, xL, yT, yB: yT + h, w, h, rad: h / 2, r: h * CORNER_R,
    cx: xL + w - h / 2, cy: yT + h / 2, sigmaMax, from: v.from };
}

function dSeg(x, y, x0, y0, x1, y1) {
  const dx = x1 - x0, dy = y1 - y0;
  const t = Math.max(0, Math.min(1, ((x - x0) * dx + (y - y0) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(x - (x0 + t * dx), y - (y0 + t * dy));
}

/* 圆弧段距离：仅当点在弧的角度范围内取 |到圆心距离 − 半径|，否则取到两端点距离。
   必须按段算——整圆的 |…−半径| 会让圆的下半/左半穿进实心内部，刻出虚线圈。 */
function dArcSeg(x, y, cx0, cy0, rad, a0, a1) {
  const ang = Math.atan2(y - cy0, x - cx0);
  if (ang >= a0 && ang <= a1) return Math.abs(Math.hypot(x - cx0, y - cy0) - rad);
  return Math.min(
    Math.hypot(x - (cx0 + rad * Math.cos(a0)), y - (cy0 + rad * Math.sin(a0))),
    Math.hypot(x - (cx0 + rad * Math.cos(a1)), y - (cy0 + rad * Math.sin(a1))),
  );
}

function inD(x, y, g) {
  if (y <= g.yT || y >= g.yB || x <= g.xL) return false;
  if (x >= g.cx) return Math.hypot(x - g.cx, y - g.cy) <= g.rad;
  if (x < g.xL + g.r) {
    if (y < g.yT + g.r && Math.hypot(x - g.xL - g.r, y - g.yT - g.r) > g.r) return false;
    if (y > g.yB - g.r && Math.hypot(x - g.xL - g.r, y - g.yB + g.r) > g.r) return false;
  }
  return true;
}

/* D 的符号距离（负在内）：六段边界取最近——左竖边、平顶、平底、左上/左下圆角弧、右大弧 */
function sdD(x, y, g) {
  const dist = Math.min(
    dSeg(x, y, g.xL, g.yT + g.r, g.xL, g.yB - g.r),
    dSeg(x, y, g.xL + g.r, g.yT, g.cx, g.yT),
    dSeg(x, y, g.xL + g.r, g.yB, g.cx, g.yB),
    dArcSeg(x, y, g.xL + g.r, g.yT + g.r, g.r, -Math.PI, -Math.PI / 2),
    dArcSeg(x, y, g.xL + g.r, g.yB - g.r, g.r, Math.PI / 2, Math.PI),
    dArcSeg(x, y, g.cx, g.cy, g.rad, -Math.PI / 2, Math.PI / 2),
  );
  return inD(x, y, g) ? -dist : dist;
}

/* N(0,1) CDF，经 erfc 的 A&S 7.1.26 有理近似（|ε| < 1.5e-7） */
function cdf(z) {
  const x = Math.abs(z) * Math.SQRT1_2;
  if (x >= 3.9) return z > 0 ? 1 : 0;
  const t = 1 / (1 + 0.3275911 * x);
  const e = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741
    + t * (-1.453152027 + t * 1.061405429)))) * Math.exp(-x * x);
  return z > 0 ? 1 - e / 2 : e / 2;
}

/* 8×8 拜耳有序抖动：±0.5 级灰度，消 8-bit 等值色带；固定矩阵，无随机种子 */
const BAYER = [
  0, 32, 8, 40, 2, 34, 10, 42,
  48, 16, 56, 24, 50, 18, 58, 26,
  12, 44, 4, 36, 14, 46, 6, 38,
  60, 28, 52, 20, 62, 30, 54, 22,
  3, 35, 11, 43, 1, 33, 9, 41,
  51, 19, 57, 25, 49, 17, 59, 27,
  15, 47, 7, 39, 13, 45, 5, 37,
  63, 31, 55, 23, 61, 29, 53, 21,
];

const r2 = (n) => Math.round(n * 100) / 100;
const newCanvas = (S) => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  return cv;
};

/* 标记墨量逐像素合成到画布上。map: 画布坐标 → 设计坐标（canvas = design·k + o）。
   crisp=true 走清晰剪影（小尺寸/模板图用），否则走连续 σ 场。 */
function paintInk(cv, g, map, crisp) {
  const S = cv.width, ctx = cv.getContext('2d');
  const img = ctx.getImageData(0, 0, S, S), data = img.data;
  for (let j = 0; j < S; j++) {
    for (let i = 0; i < S; i++) {
      const x = (i + 0.5 - map.ox) / map.k, y = (j + 0.5 - map.oy) / map.k;
      const d = sdD(x, y, g);
      let s = 0;
      if (!crisp) {
        const u = (x - g.xL) / g.w;
        s = u <= g.from ? 0 : g.sigmaMax * Math.min(1, (u - g.from) / (RAMP_TO - g.from));
      }
      /* σ=0（剪影区）用线性覆盖度做 1px 抗锯齿 */
      const a = s < 1e-9 ? Math.max(0, Math.min(1, 0.5 - d * map.k)) : cdf(-d / s);
      if (a <= 0) continue;
      const k4 = (j * S + i) * 4;
      const ba = data[k4 + 3] / 255, bg = data[k4];
      const a2 = a + ba * (1 - a);
      const gray = (bg * ba * (1 - a) + INK_GRAY * a) / a2;
      const q = Math.max(0, Math.min(255, Math.round(gray + (BAYER[(j & 7) * 8 + (i & 7)] / 64 - 0.5))));
      data[k4] = q; data[k4 + 1] = q; data[k4 + 2] = q;
      data[k4 + 3] = Math.round(a2 * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

/* 主 Logo：白底方版（含右侧渐变） */
function logoCanvas(S) {
  const g = geom(MARK, CANVAS);
  const cv = newCanvas(S);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, S, S);
  return paintInk(cv, g, { k: S / CANVAS, ox: 0, oy: 0 }, false);
}

/* 图标 = 满幅图（画布四边不留透明、不切圆角、不烘投影）：macOS 26 自己套壳切形，
   应用自切圆角或留边会被系统垫一层底板，读成"灰一圈 + 里面白砖"。
   ≥128 档直接用主 Logo 缩档；16/32 槽位用这个清晰剪影版（渐变在极小尺寸糊成一块）。 */
function smallIconCanvas(S) {
  const g = geom(MARK, CANVAS);
  const cv = newCanvas(S);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, S, S);
  const k = (SMALL_FIT * S) / g.h;
  return paintInk(cv, g, { k, ox: S / 2 - (g.xL + g.w / 2) * k, oy: S / 2 - (g.yT + g.h / 2) * k }, true);
}

/* 壳侧用的剪影路径（平移到墨迹左上角，viewBox 0 0 w h）——悬浮球与菜单栏模板图。
   dx 用于补成正方形盒：壳侧按正方形 rect 绘制，非方形 viewBox 会被拉伸 2% */
function markPath(g, dx = 0) {
  const x = (v) => r2(v + dx), rr = r2(g.r), rad = r2(g.rad), h = r2(g.h);
  return `M ${x(g.r)} 0 L ${x(g.w - g.rad)} 0 A ${rad} ${rad} 0 0 1 ${x(g.w - g.rad)} ${h}`
    + ` L ${x(g.r)} ${h} A ${rr} ${rr} 0 0 1 ${x(0)} ${r2(g.h - g.r)}`
    + ` L ${x(0)} ${rr} A ${rr} ${rr} 0 0 1 ${x(g.r)} 0 Z`;
}

/* ---------------- 导出 ---------------- */
function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportAll() {
  let i = 0;
  for (const s of [CANVAS, ...LADDER]) {
    const cv = logoCanvas(s);
    setTimeout(() => cv.toBlob((b) => download(b, `deepdive-logo-${s}.png`), 'image/png'), 150 * i++);
  }
  for (const s of [64, 32, 16]) {
    const cv = smallIconCanvas(s);
    setTimeout(() => cv.toBlob((b) => download(b, `deepdive-icon-small-${s}.png`), 'image/png'), 150 * i++);
  }
}

/* ---------------- 页面组装 ---------------- */
function tile(parent, cv, caption, checker) {
  const d = document.createElement('div');
  d.className = checker ? 'board checker' : 'board';
  cv.style.width = PREVIEW + 'px';
  cv.style.height = PREVIEW + 'px';
  d.appendChild(cv);
  const c = document.createElement('div');
  c.className = 'cap';
  c.innerHTML = caption;
  d.appendChild(c);
  parent.appendChild(d);
}

function renderBoard() {
  tile(document.getElementById('markRow'), logoCanvas(PREVIEW),
    `<b>主 Logo</b> — 白底方版，D 高 72% 画布，右侧 σ 由 0（0.42W）线性涨到 0.055H（实心右缘）`);

  const iconRow = document.getElementById('iconRow');
  tile(iconRow, logoCanvas(PREVIEW),
    '<b>AppIcon 用的就是它</b> — 满幅白底 + D，圆角/外壳由 macOS 自己切（应用不切角、不留透明边）');
  for (const s of [64, 32, 16]) {
    const d = document.createElement('div');
    d.className = 'board checker';
    const cv = smallIconCanvas(s * 4);
    cv.style.width = s * 4 + 'px';
    cv.style.height = s * 4 + 'px';
    cv.style.imageRendering = 'pixelated';
    d.appendChild(cv);
    const c = document.createElement('div');
    c.className = 'cap';
    c.innerHTML = `<b>小尺寸剪影</b> — ${s}px 直渲（无渐变，清晰剪影）放大 ${4}×`;
    d.appendChild(c);
    iconRow.appendChild(d);
  }

  const ladderRow = document.getElementById('ladderRow');
  for (const s of LADDER) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.appendChild(logoCanvas(s));
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.textContent = s + 'px';
    cell.appendChild(lb);
    ladderRow.appendChild(cell);
  }
}

/* 单标模式（无头渲染用）：
   ?logo=<边长>            白底方版主 Logo；截图即产物
   ?icon=master            1024 图标母版；?icon=small&size=<n> 全幅剪影图标
   ?path=1                 输出壳侧用剪影路径（viewBox 与其后的 d） */
const q = new URLSearchParams(location.search);
let mode = 'board';
if (q.get('path') === '1') mode = 'path';
else if (q.has('small')) mode = 'small';
else if (q.has('logo')) mode = 'logo';

if (mode === 'board') {
  renderBoard();
} else {
  document.getElementById('wrap').remove();
  document.body.style.margin = '0';
  document.body.style.background = 'transparent';
  if (mode === 'path') {
    const g = geom(MARK, CANVAS);
    document.body.textContent = `viewBox="0 0 ${r2(g.h)} ${r2(g.h)}" d="${markPath(g, (g.h - g.w) / 2)}"`;
  } else {
    const cv = mode === 'small' ? smallIconCanvas(Number(q.get('small'))) : logoCanvas(Number(q.get('logo')));
    cv.style.display = 'block';
    document.body.appendChild(cv);
  }
}
</script>
</body>
</html>
