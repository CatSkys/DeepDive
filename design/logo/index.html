<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepDive Logo — 设计稿 v2</title>
<style>
  :root { --bg:#17181b; --ink:#e9e7e1; --dim:#98958d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:1560px; margin:0 auto; padding:40px 32px 90px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.3px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  h2 { font-size:15px; font-weight:600; margin:44px 0 14px; }
  .tools { display:flex; gap:12px; margin:0 0 26px; }
  button { background:#24262b; color:var(--ink); border:1px solid #37393f; border-radius:8px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:#2d2f35; }
  .row { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-end; }
  .board canvas.main { display:block; width:452px; height:452px; border-radius:14px; }
  .cap { margin-top:10px; color:var(--dim); font-size:12.5px; max-width:452px; }
  .cap b { color:var(--ink); font-weight:600; }
  .ladder { display:flex; gap:20px; align-items:flex-end; }
  .ladder .cell { text-align:center; }
  .ladder .plate { background:#ffffff; display:inline-block; line-height:0; border-radius:6px; }
  .ladder canvas { display:block; }
  .ladder .lb { margin-top:8px; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DeepDive — Logo 设计稿 v2</h1>
  <div class="sub">ASCII 字符构成鲸鱼 · 黑色墨字 · 透明底资产 · 种子 <span id="seedLabel">—</span></div>
  <div class="tools">
    <button onclick="regen()">↻ 重新生成（换种子）</button>
    <button onclick="exportAll()">⬇ 导出全部 PNG</button>
  </div>

  <h2 style="margin-top:0">主 Logo（同一份透明底资产的三种展示底）</h2>
  <div class="row" id="mainRow"></div>

  <h2>图标容器概念（浅色磨砂玻璃 + 噪点 + 高斯模糊，黑字符在其上成立）</h2>
  <div class="row" id="iconRow"></div>

  <h2>尺寸阶梯（同算法重渲染，透明底，白底仅为展示）</h2>
  <div class="ladder" id="ladderRow"></div>
</div>

<script>
'use strict';

/* 官方 DeepSeek whale path（viewBox 0 0 50 50，取自 deepseek-harness favicon.svg） */

/* ---------------- 可复现随机 ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------------- 鲸鱼几何 ---------------- */
const SAMPLE = 1024;
let whaleFit = null;

function computeFit() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fill(WHALE_PATH);
  const d = x.getImageData(0, 0, 256, 256).data;
  let minX = 256, minY = 256, maxX = 0, maxY = 0;
  for (let py = 0; py < 256; py++) for (let px = 0; px < 256; px++) {
    if (d[(py * 256 + px) * 4 + 3] > 40) {
      if (px < minX) minX = px; if (px > maxX) maxX = px;
      if (py < minY) minY = py; if (py > maxY) maxY = py;
    }
  }
  const bw = maxX - minX, bh = maxY - minY;
  const scale = (SAMPLE * 0.72) / Math.max(bw, bh);
  whaleFit = {
    scale,
    dx: SAMPLE / 2 - (minX + bw / 2) * scale,
    dy: SAMPLE * 0.485 - (minY + bh / 2) * scale,
  };
}

function drawWhale(ctx, color) {
  ctx.save();
  ctx.translate(whaleFit.dx, whaleFit.dy);
  ctx.scale(whaleFit.scale, whaleFit.scale);
  ctx.fillStyle = color;
  ctx.fill(WHALE_PATH);
  ctx.restore();
}

/* mask + 两级模糊采样图 */
function buildMaps() {
  const mk = () => { const c = document.createElement('canvas'); c.width = c.height = SAMPLE; return c; };
  const mask = mk(), b1 = mk(), b2 = mk();
  const mx = mask.getContext('2d'); drawWhale(mx, '#fff');
  const x1 = b1.getContext('2d'); x1.filter = 'blur(9px)';  x1.drawImage(mask, 0, 0);
  const x2 = b2.getContext('2d'); x2.filter = 'blur(30px)'; x2.drawImage(mask, 0, 0);
  return { m: mx.getImageData(0, 0, SAMPLE, SAMPLE).data,
           b1: x1.getImageData(0, 0, SAMPLE, SAMPLE).data,
           b2: x2.getImageData(0, 0, SAMPLE, SAMPLE).data };
}

/* ---------------- ASCII 鲸鱼层（透明底，黑色墨字） ----------------
   字符本身构成鲸鱼：轮廓带 # x *，体内部 = + 疏排留白，外围 . ' 光点晕。 */
const RAMP = ['\'', '.', ':', '-', '=', '+', '*', 'x', '#'];
const INK = '#0b0b0c';

function renderAsciiLayer(size, cols, maps, rng) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const { m, b1, b2 } = maps;

  let minX = SAMPLE, minY = SAMPLE, maxX = 0, maxY = 0;
  for (let y = 0; y < SAMPLE; y += 2) for (let x = 0; x < SAMPLE; x += 2) {
    if (m[(y * SAMPLE + x) * 4 + 3] > 40) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  const bw = maxX - minX, bh = maxY - minY;
  const adv = bw / cols;
  const cell = adv / 0.62;
  const rows = Math.ceil(bh / cell);
  const k = size / SAMPLE;

  // 小尺寸补偿：图标越小字符越要抱团，1024 保持设计密度不变
  const boost = Math.min(1.7, Math.max(1, 1.7 - (size / 1024) * 0.7));
  const q = cell * 0.28;  // 粗网格下扩大采样窗，细弯月不漏
  // 粗网格分档：采样点更密、骨架/薄带阈值更宽，否则环带断裂
  const coarse = cols <= 48;
  const SK = coarse ? 0.42 : 0.5;    // 强轮廓骨架阈值
  const TB_E = coarse ? 0.24 : 0.3;  // 薄带判定：edge
  const TB_U = coarse ? 0.28 : 0.35; // 薄带判定：blur30
  const PTS = coarse
    ? [[0, 0], [-q, -q], [q, -q], [-q, q], [q, q], [0, -q], [0, q], [-q, 0], [q, 0]]
    : [[0, 0], [-q, -q], [q, -q], [-q, q], [q, q]];

  ctx.scale(k, k);
  ctx.font = `700 ${cell * 1.02}px "SF Mono", Menlo, Consolas, monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = INK;

  // 每格 5 点子采样（格心 + 四角）：细弯月不漏
  const at = (x, y) => {
    const xi = Math.max(0, Math.min(SAMPLE - 1, x | 0));
    const yi = Math.max(0, Math.min(SAMPLE - 1, y | 0));
    return (yi * SAMPLE + xi) * 4;
  };

  for (let r = 0; r < rows; r++) {
    const rowOff = (rng() - 0.5) * adv * 0.55;   // 逐行随机错位，套印感但不呆板
    for (let c = 0; c < cols; c++) {
      const px = minX + (c + 0.5) * adv + adv * 0.12 + rowOff;
      const py = minY + (r + 0.42) * cell - cell * 0.10;
      let ai = 0, wi = 0;
      for (const pt of PTS) {
        const ii = at(px + pt[0], py + pt[1]);
        if (m[ii + 3] > ai) ai = m[ii + 3];
        if (b1[ii + 3] > wi) wi = b1[ii + 3];
      }
      const i2 = at(px, py);
      const a = ai / 255;
      const u1 = wi / 255, u2 = b2[i2 + 3] / 255;
      // 密度 = 轮廓带为主 + 存在场；大字符下保持中等覆盖
      const edge = Math.max(0, u1 - u2) * 1.55;
      const s = (edge * 0.85 + u1 * 0.34 * boost) * (0.5 + 0.9 * rng());
      if (s < 0.22 / boost) continue;  // 低分格直接留白

      if (a < 0.25) {  // 轮廓外（含嘴/眼镂空）：点晕描出负形
        if (u1 > 0.12 && rng() < 0.16) {
          ctx.globalAlpha = 0.24 + rng() * 0.20;
          const ch = rng() < 0.72 ? '.' : (rng() < 0.5 ? '-' : '\'');
          ctx.fillText(ch, px, py);
        } else if (u1 > 0.04 && rng() < 0.06) {
          ctx.globalAlpha = 0.18 + rng() * 0.14;
          ctx.fillText('.', px, py);
        }
        continue;
      }
      // 环身薄带：非强轮廓格直接舍弃，负形（左侧大镂空/嘴）边界才干净
      if (edge < TB_E && u2 < TB_U) continue;
      // 强轮廓格：剪影的骨架，仅极少量随机断口，保证形态连续又不呆板
      if (edge > SK) {
        if (rng() < 0.05) continue;
        ctx.globalAlpha = 0.82 + rng() * 0.16;
        const ch = RAMP[6 + ((rng() * 3) | 0)];  // + * x
        ctx.fillText(ch, px + (rng() - 0.5) * cell * 0.08, py + (rng() - 0.5) * cell * 0.06);
        continue;
      }
      if (rng() < (u2 > 0.8 ? 0.20 / boost : 0.10)) continue;  // 随机空洞，深处更疏
      let ch = RAMP[Math.min(RAMP.length - 1, (s * RAMP.length) | 0)];
      if (rng() < 0.08) ch = RAMP[1 + ((rng() * (RAMP.length - 1)) | 0)];
      if (ch === undefined) continue;
      ctx.globalAlpha = Math.min(1, Math.max(0.42, 0.52 + s * 0.48 + (rng() - 0.5) * 0.18));
      ctx.fillText(ch, px + (rng() - 0.5) * cell * 0.10, py + (rng() - 0.5) * cell * 0.08);
    }
  }
  // 眼部签名：官方 logo 眼点（viewBox ≈ 26.96, 24.6）处一个固定字符簇
  {
    const ex = whaleFit.dx + 26.96 * whaleFit.scale;
    const ey = whaleFit.dy + 24.6 * whaleFit.scale;
    ctx.fillStyle = INK;
    ctx.globalAlpha = 0.92;
    ctx.fillText('#', ex, ey);
    ctx.globalAlpha = 0.45;
    ctx.fillText('\'', ex, ey - cell * 0.95);
    ctx.fillText('.', ex - cell * 0.62, ey);
    ctx.fillText('.', ex + cell * 0.62, ey);
    ctx.fillText('.', ex, ey + cell * 0.95);
  }
  ctx.globalAlpha = 1;
  return cv;
}

/* ---------------- 展示底（不进入导出资产） ---------------- */
function paintChecker(ctx, size) {
  const n = 16, s = size / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    ctx.fillStyle = (x + y) % 2 ? '#d6d6d8' : '#f4f4f5';
    ctx.fillRect(x * s, y * s, s + 0.5, s + 0.5);
  }
}

function paintWhite(ctx, size) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
}

/* 浅色磨砂玻璃（图标容器）：高斯模糊色域 + 粗细噪点 + 玻璃高光 */
function paintGlassLight(ctx, size, rng) {
  ctx.fillStyle = '#eceae4';
  ctx.fillRect(0, 0, size, size);
  const blobs = [
    { x:.28, y:.26, r:.46, c:'#dcd8cf', a:.9 },
    { x:.80, y:.18, r:.36, c:'#c9c5ba', a:.85 },
    { x:.62, y:.86, r:.46, c:'#f2f0ea', a:.9 },
    { x:.12, y:.76, r:.40, c:'#bcb7ab', a:.75 },
    { x:.86, y:.60, r:.26, c:'#a8a294', a:.5 },
  ];
  for (const b of blobs) {
    const g = ctx.createRadialGradient(b.x * size, b.y * size, 0, b.x * size, b.y * size, b.r * size);
    g.addColorStop(0, b.c); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalAlpha = b.a;
    ctx.filter = `blur(${size * 0.105}px)`;
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    ctx.restore();
  }
  // 玻璃斜向光/暗条
  for (const s of [
    { x:.18, y:-.15, w:.16, h:1.5, a:.07, c:'#ffffff' },
    { x:.36, y:-.20, w:.07, h:1.6, a:.05, c:'#4a4438' },
  ]) {
    ctx.save();
    ctx.translate(s.x * size, s.y * size);
    ctx.rotate(0.5);
    ctx.filter = `blur(${size * 0.02}px)`;
    ctx.globalAlpha = s.a;
    ctx.fillStyle = s.c;
    ctx.fillRect(0, 0, s.w * size, s.h * size);
    ctx.restore();
  }
  // 粗颗粒噪点
  const n = 140;
  const c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d');
  const img = x.createImageData(n, n);
  for (let i = 0; i < img.data.length; i += 4) {
    const g = (rng() * 255) | 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = g;
    img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  ctx.save();
  ctx.globalAlpha = 0.12;
  ctx.globalCompositeOperation = 'overlay';
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c, 0, 0, n, n, 0, 0, size, size);
  ctx.restore();
  // 顶部反光 + 暗角 + 内缘
  const sheen = ctx.createLinearGradient(0, 0, 0, size * 0.6);
  sheen.addColorStop(0, 'rgba(255,255,255,.20)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0, 0, size, size * 0.6);
  const vg = ctx.createRadialGradient(size / 2, size / 2, size * 0.36, size / 2, size / 2, size * 0.74);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(96,86,64,.20)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.lineWidth = Math.max(1, size / 700);
  ctx.strokeRect(ctx.lineWidth / 2, ctx.lineWidth / 2, size - ctx.lineWidth, size - ctx.lineWidth);
}

/* ---------------- 页面组装与导出 ---------------- */
let SEED = 20260902;
const boards = [];
const LADDER_COLS = { 512: 30, 256: 20, 128: 14, 64: 10, 32: 8 };

function addBoard(parent, canvas, caption) {
  const d = document.createElement('div');
  d.className = 'board';
  canvas.classList.add('main');
  d.appendChild(canvas);
  const c = document.createElement('div');
  c.className = 'cap';
  c.innerHTML = caption;
  d.appendChild(c);
  parent.appendChild(d);
}

function renderAll() {
  document.getElementById('seedLabel').textContent = SEED;
  for (const id of ['mainRow', 'iconRow', 'ladderRow']) document.getElementById(id).innerHTML = '';
  boards.length = 0;

  const maps = buildMaps();

  // 主 Logo：同一透明底字符层，三种展示底（44 列 = 大字符、少而大）
  const logo = renderAsciiLayer(1024, 44, maps, mulberry32(SEED));
  logo._export = { name: 'deepdive-logo-ascii-black-1024.png' };
  boards.push(logo);

  const show = (painter, cap) => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 1024;
    painter(cv.getContext('2d'), 1024);
    cv.getContext('2d').drawImage(logo, 0, 0);
    addBoard(document.getElementById('mainRow'), cv, cap);
  };
  show(paintChecker, '<b>透明底</b>（棋盘格仅为示透明）— 导出的 PNG 即此层，无背景');
  show(paintWhite, '<b>白底应用场景</b> — 文档/网页/浅色界面');
  show((ctx, size) => paintGlassLight(ctx, size, mulberry32(SEED + 1)),
    '<b>浅玻璃应用场景</b> — 呼应最初「玻璃 + 噪点 + 高斯模糊」的方向，现为图标容器');

  // 图标容器概念：浅磨砂玻璃圆角矩形 + 黑色 ASCII 鲸鱼
  const icon = document.createElement('canvas'); icon.width = icon.height = 1024;
  const ictx = icon.getContext('2d');
  ictx.save();
  const rad = 1024 * 0.2237;
  ictx.beginPath();
  ictx.moveTo(rad, 0); ictx.arcTo(1024, 0, 1024, 1024, rad); ictx.arcTo(1024, 1024, 0, 1024, rad);
  ictx.arcTo(0, 1024, 0, 0, rad); ictx.arcTo(0, 0, 1024, 0, rad);
  ictx.closePath(); ictx.clip();
  paintGlassLight(ictx, 1024, mulberry32(SEED + 2));
  ictx.drawImage(logo, 0, 0);
  ictx.restore();
  icon._export = { name: 'deepdive-icon-frosted-1024-squircle.png' };
  boards.push(icon);
  addBoard(document.getElementById('iconRow'), icon,
    '<b>macOS 图标概念</b> — 22.37% 圆角浅磨砂玻璃，黑字符鲸鱼居中');

  // 尺寸阶梯（透明资产，白底展示）
  const ladder = document.getElementById('ladderRow');
  for (const s of [512, 256, 128, 64, 32]) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const layer = renderAsciiLayer(s, LADDER_COLS[s], maps, mulberry32(SEED * 7919 + s));
    layer._export = { name: `deepdive-logo-ascii-black-${s}.png` };
    boards.push(layer);
    const plate = document.createElement('div');
    plate.className = 'plate';
    layer.style.width = layer.style.height = s + 'px';
    plate.appendChild(layer);
    cell.appendChild(plate);
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.textContent = s + 'px';
    cell.appendChild(lb);
    ladder.appendChild(cell);
  }
}

function regen() { SEED = (Math.random() * 1e9) | 0; renderAll(); }

function exportAll() {
  for (const cv of boards) {
    if (!cv._export) continue;
    cv.toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = cv._export.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  }
}

computeFit();
document.fonts.ready.then(renderAll);
</script>
</body>
</html>
