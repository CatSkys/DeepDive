<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepDive — 倒三角 Logo 候选集 v1</title>
<style>
  :root { --bg:#17181b; --ink:#e9e7e1; --dim:#98958d; --line:#37393f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:1560px; margin:0 auto; padding:40px 32px 90px; }
  h1 { font-size:22px; font-weight:600; letter-spacing:.3px; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  h2 { font-size:15px; font-weight:600; margin:44px 0 14px; }
  .tools { display:flex; gap:12px; margin:0 0 26px; }
  button { background:#24262b; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { background:#2d2f35; }
  .row { display:flex; gap:26px; flex-wrap:wrap; align-items:flex-end; }
  .board svg { display:block; border-radius:14px; box-shadow:0 0 0 1px var(--line); }
  .cap { margin-top:10px; color:var(--dim); font-size:12.5px; max-width:452px; }
  .cap b { color:var(--ink); font-weight:600; }
  .ladder { display:flex; gap:20px; align-items:flex-end; }
  .ladder .cell { text-align:center; }
  .ladder svg { display:block; border-radius:4px; box-shadow:0 0 0 1px var(--line); }
  .ladder .lb { margin-top:8px; color:var(--dim); font-size:11.5px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>DeepDive — 倒三角 Logo 候选集 v1</h1>
  <div class="sub">白底 <span style="color:#fff">#FFFFFF</span> · 黑倒三角 <span style="color:#c8c6c0">#0b0b0c</span> · 纯矢量确定性渲染（无随机种子）</div>
  <div class="tools">
    <button onclick="exportAllPNG()">⬇ 导出全部 PNG</button>
    <button onclick="exportAllSVG()">⬇ 导出全部 SVG</button>
  </div>

  <h2 style="margin-top:0">变体对比（同一 1024 画布，导出资产即此）</h2>
  <div class="row" id="markRow"></div>

  <h2>光学居中对照（基准变体，二者仅纵向下移量不同）</h2>
  <div class="row" id="optRow"></div>

  <h2>尺寸阶梯（基准变体，同配方重渲染）</h2>
  <div class="ladder" id="ladderRow"></div>
</div>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const CANVAS = 1024;        // 逻辑画布（viewBox 边长），导出按目标尺寸缩放
const PAPER = '#ffffff';
const INK = '#0b0b0c';      // 与品牌黑同值

/* ---------------- 配方常量：改这里即改全部产物 ---------------- */
const FIT = 0.72;           // 倒三角长边 = 画布 72%（沿用鲸鱼 logo 的体量）
const CENTER_Y = 0.515;     // 光学中心 y：倒三角重心偏上，整体下移 1.5% 才显正
const BBOX_Y = 0.500;       // 对照用：包围盒居中
const WIDE = { w: 0.80, h: 0.58 };
const ROUND_R = 0.06;       // 圆角半径 = 长边 6%
const RINGS_K = 0.52;       // 同心镂空：内三角按内切圆心缩放的比例
const SQUIRCLE_R = 0.2237;  // 容器圆角，与壳侧 AppIcon 同值
const LADDER = [512, 256, 128, 64, 32, 16];
const PREVIEW = 452;

const r2 = (n) => Math.round(n * 100) / 100;

/* 倒三角：TL → TR → 下顶点 */
function triPath(cx, cy, w, h) {
  return `M ${r2(cx - w / 2)} ${r2(cy - h / 2)} L ${r2(cx + w / 2)} ${r2(cy - h / 2)} L ${r2(cx)} ${r2(cy + h / 2)} Z`;
}

/* 圆角倒三角：每个顶点按内角切掉切线长 t = r/tan(θ/2)，用圆弧连接切点 */
function roundedTriPath(cx, cy, w, h, r) {
  const P = [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx, cy + h / 2]];
  const unit = (from, to) => {
    const dx = to[0] - from[0], dy = to[1] - from[1], len = Math.hypot(dx, dy);
    return [dx / len, dy / len];
  };
  const enter = [], leave = [];
  for (let i = 0; i < 3; i++) {
    const p = P[i], u = unit(p, P[(i + 2) % 3]), v = unit(p, P[(i + 1) % 3]);
    const t = r / Math.tan(Math.acos(u[0] * v[0] + u[1] * v[1]) / 2);
    enter.push([p[0] + u[0] * t, p[1] + u[1] * t]);
    leave.push([p[0] + v[0] * t, p[1] + v[1] * t]);
  }
  let d = `M ${r2(leave[0][0])} ${r2(leave[0][1])}`;
  for (let i = 0; i < 3; i++) {
    const e = enter[(i + 1) % 3], l = leave[(i + 1) % 3];
    d += ` L ${r2(e[0])} ${r2(e[1])} A ${r2(r)} ${r2(r)} 0 0 1 ${r2(l[0])} ${r2(l[1])}`;
  }
  return d + ' Z';
}

/* 五个变体：layers 返回几何层，bg 决定是否铺白底（图标容器用透明画布） */
const MARKS = {
  equilateral: {
    title: '基准 · 等边实心',
    note: '等边倒三角，长边 72% 画布（737.28px / 高 638.51px）',
    bg: true,
    layers: (S, cy) => {
      const w = S * FIT, h = w * Math.sqrt(3) / 2;
      return [{ d: triPath(S / 2, cy, w, h), fill: INK }];
    },
  },
  wide: {
    title: '扁平 · 等宽实心',
    note: '更宽更矮的等腰倒三角（80% × 58% 画布，顶点角 71.6°），视觉更稳',
    bg: true,
    layers: (S, cy) => {
      const w = S * WIDE.w, h = S * WIDE.h;
      return [{ d: triPath(S / 2, cy, w, h), fill: INK }];
    },
  },
  rounded: {
    title: '圆角 · 等边实心',
    note: '等边倒三角 + 6% 长边圆角（半径 44.24px），呼应 squircle 容器语言',
    bg: true,
    layers: (S, cy) => {
      const w = S * FIT, h = w * Math.sqrt(3) / 2;
      return [{ d: roundedTriPath(S / 2, cy, w, h, w * ROUND_R), fill: INK }];
    },
  },
  rings: {
    title: '同心 · 镂空双层',
    note: '黑三角内挖白三角（按内切圆心缩至 52%），环宽均匀 102.16px，读作层层下潜',
    bg: true,
    layers: (S, cy) => {
      const w = S * FIT, h = w * Math.sqrt(3) / 2;
      const inY = cy - h / 6;                       // 等边三角内切圆心（= 重心）
      const innerCy = inY + (cy - inY) * RINGS_K;
      return [
        { d: triPath(S / 2, cy, w, h), fill: INK },
        { d: triPath(S / 2, innerCy, w * RINGS_K, h * RINGS_K), fill: PAPER },
      ];
    },
  },
  squircle: {
    title: '图标容器 · 白 squircle',
    note: '22.37% 圆角白容器 + 黑三角，透明画布（AppIcon 母版形态）',
    bg: false,
    layers: (S, cy) => {
      const w = S * FIT, h = w * Math.sqrt(3) / 2;
      return [
        { rect: [0, 0, S, S], rx: S * SQUIRCLE_R, fill: PAPER },
        { d: triPath(S / 2, cy, w, h), fill: INK },
      ];
    },
  },
};

function shapeEl(layer) {
  const e = document.createElementNS(SVGNS, layer.rect ? 'rect' : 'path');
  if (layer.rect) {
    const [x, y, w, h] = layer.rect;
    e.setAttribute('x', x); e.setAttribute('y', y);
    e.setAttribute('width', w); e.setAttribute('height', h);
    if (layer.rx) e.setAttribute('rx', r2(layer.rx));
  } else {
    e.setAttribute('d', layer.d);
  }
  e.setAttribute('fill', layer.fill);
  return e;
}

function markSVG(id, size, centerY) {
  const S = CANVAS;
  const cy = S * (centerY === undefined ? CENTER_Y : centerY);
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('xmlns', SVGNS);
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
  if (MARKS[id].bg) svg.appendChild(shapeEl({ rect: [0, 0, S, S], fill: PAPER }));
  for (const layer of MARKS[id].layers(S, cy)) svg.appendChild(shapeEl(layer));
  return svg;
}

/* ---------------- 导出 ---------------- */
const svgText = (svg) => '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svg) + '\n';

function download(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function exportPNG(id, size) {
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    cv.getContext('2d').drawImage(img, 0, 0, size, size);
    cv.toBlob((blob) => download(blob, `deepdive-triangle-${id}-${size}.png`), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText(markSVG(id, size)));
}

function exportSVG(id) {
  download(new Blob([svgText(markSVG(id, CANVAS))], { type: 'image/svg+xml' }), `deepdive-triangle-${id}.svg`);
}

/* 分批触发：Chrome 对连续下载有节流 */
function exportAllPNG() {
  let i = 0;
  for (const id of Object.keys(MARKS)) {
    for (const s of (id === 'equilateral' ? [CANVAS, ...LADDER] : [CANVAS])) {
      setTimeout(() => exportPNG(id, s), 150 * i++);
    }
  }
}

function exportAllSVG() {
  Object.keys(MARKS).forEach((id, i) => setTimeout(() => exportSVG(id), 150 * i));
}

/* ---------------- 页面组装 ---------------- */
function tile(parent, svg, caption) {
  const d = document.createElement('div');
  d.className = 'board';
  svg.style.width = PREVIEW + 'px';
  svg.style.height = PREVIEW + 'px';
  d.appendChild(svg);
  const c = document.createElement('div');
  c.className = 'cap';
  c.innerHTML = caption;
  d.appendChild(c);
  parent.appendChild(d);
}

function renderBoard() {
  const markRow = document.getElementById('markRow');
  for (const id of Object.keys(MARKS)) {
    tile(markRow, markSVG(id, PREVIEW), `<b>${MARKS[id].title}</b> — ${MARKS[id].note}`);
  }

  const optRow = document.getElementById('optRow');
  tile(optRow, markSVG('equilateral', PREVIEW, BBOX_Y), '<b>包围盒居中</b> — y 50.0%，上缘与下顶点留白相等，重心偏上');
  tile(optRow, markSVG('equilateral', PREVIEW, CENTER_Y), '<b>光学居中</b> — y 51.5%，上缘多留 1.5%，视觉落正（当前配方）');

  const ladderRow = document.getElementById('ladderRow');
  for (const s of LADDER) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const svg = markSVG('equilateral', s);
    svg.style.width = s + 'px';
    svg.style.height = s + 'px';
    cell.appendChild(svg);
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.textContent = s + 'px';
    cell.appendChild(lb);
    ladderRow.appendChild(cell);
  }
}

/* 单标模式（无头渲染用）：
   ?mark=<id>&size=1024   → 整页只有该标记，截图即定尺寸产物
   ?mark=<id>             → 同上但按 1024；?mark=<id>&svg=1 时整页只有 SVG 元素 */
const q = new URLSearchParams(location.search);
const singleId = q.get('mark');
if (singleId && MARKS[singleId]) {
  document.getElementById('wrap').remove();
  const svg = markSVG(singleId, Number(q.get('size')) || CANVAS);
  svg.style.display = 'block';
  document.body.style.margin = '0';
  document.body.style.background = 'transparent';
  document.body.appendChild(svg);
} else {
  renderBoard();
}
</script>
</body>
</html>
