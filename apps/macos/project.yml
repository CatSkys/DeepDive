name: DSHmini
options:
  bundleIdPrefix: com.deepdive
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  DSHminiApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # 侧栏浏览器的 agent 控制面：MCP server（暴露单个 js 工具）+ 浏览器 SDK。
      # 纯 JS 资源，由 BrowserUseInstaller 装进 support 目录后交给引擎 spawn。
      # type: folder —— 必须是目录引用：普通资源会被拷到 Resources 根下摊平，
      # 安装器按目录整体复制就找不到它们了。
      - path: BrowserUse
        type: folder
        buildPhase: resources
      # 随包引擎版本引脚：直接拷入 bundle（不复制版本值，避免第二份事实源）。
      # 版本门要用它在「未嵌入引擎」的构建里也能读出 pin（SPEC-ENGINE-RUNTIME §3.4）。
      - path: ../../scripts/dsh-runtime-version.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdive.app
        PRODUCT_NAME: DeepDive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: DeepDive
        CFBundleDisplayName: DeepDive
        CFBundleIdentifier: com.deepdive.app
        CFBundleVersion: "0.1.0"
        CFBundleShortVersionString: "0.1.0"
        LSUIElement: false
        NSHumanReadableCopyright: "MIT"
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # 侧栏浏览器（第二个 WKWebView）要能加载 http:// 公网站点；只放宽 Web 内容
          NSAllowsArbitraryLoadsInWebContent: true
        NSMicrophoneUsageDescription: "听写与网页（音视频通话）需要使用麦克风。"
        NSCameraUsageDescription: "网页（视频通话、拍照上传）需要使用摄像头。"
        NSSpeechRecognitionUsageDescription: "听写使用系统语音识别将你的语音转换为文字。"
  DSHminiAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DSHminiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdive.appTests
        # 宿主产物名被 PRODUCT_NAME 覆写为 DeepDive（≠ target 名），显式指向
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DeepDive.app/Contents/MacOS/DeepDive
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DSHmini:
    build:
      targets:
        DSHminiApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSHminiAppTests
      environmentVariables:
        # 隔离支撑目录：测试宿主启动不能撞真实实例的 flock 锁（PITFALLS §7.2）
        - variable: DSHMINI_SUPPORT_DIR
          value: /tmp/dshmini-test-support
          isEnabled: true
