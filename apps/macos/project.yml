name: DSHmini
options:
  bundleIdPrefix: com.deepdive
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  DSHminiApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdive.app
        PRODUCT_NAME: DeepDive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: DeepDive
        CFBundleDisplayName: DeepDive
        CFBundleIdentifier: com.deepdive.app
        CFBundleVersion: "0.1.0"
        CFBundleShortVersionString: "0.1.0"
        LSUIElement: false
        NSHumanReadableCopyright: "MIT"
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMicrophoneUsageDescription: "听写需要使用麦克风。"
        NSSpeechRecognitionUsageDescription: "听写使用系统语音识别将你的语音转换为文字。"
  DSHminiAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DSHminiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdive.appTests
        # 宿主产物名被 PRODUCT_NAME 覆写为 DeepDive（≠ target 名），显式指向
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DeepDive.app/Contents/MacOS/DeepDive
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DSHmini:
    build:
      targets:
        DSHminiApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSHminiAppTests
      environmentVariables:
        # 隔离支撑目录：测试宿主启动不能撞真实实例的 flock 锁（PITFALLS §7.2）
        - variable: DSHMINI_SUPPORT_DIR
          value: /tmp/dshmini-test-support
          isEnabled: true
