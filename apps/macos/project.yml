name: DSHmini
packages:
  # 应用自身更新（Sparkle）：ATD 同款、macOS 自动更新的业界标准（框架自带 XPC
  # 服务做下载与替换）。exactVersion 钉死；同一版本号也被 scripts/sparkle-tools.sh
  # 用来取 sign_update——发布链用它签 appcast，两边必须同版本。
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
options:
  bundleIdPrefix: com.deepdive
  deploymentTarget:
    # 迷你面板整包复刻 Atd（其源码零守卫直接用 macOS 26 液态玻璃 API）——部署
    # 目标随之从 14.0 提到 26.0；主窗玻璃的 vibrancy 退回分支因此成死分支（暂留）。
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 移植族（截图/划词，Atd 授权复制）按「Swift 6 + 主线程默认隔离」写成，
    # 与 Atd 同一组设置；自有代码保持 Swift 5 语法面不动。
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  DSHminiApp:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Icon Composer 图标（macOS 26 Liquid Glass）：与 Assets.xcassets 同名 AppIcon，
      # actool 会忽略同名 appiconset、由 .icon 生成 IconGroup/IconImageStack 条目
      # （只有老式 Icon Image 条目时系统会把图标缩小并垫灰底板）。图层与配方见 design/logo/README。
      - path: AppIcon.icon
      # 侧栏浏览器的 agent 控制面：MCP server（暴露单个 js 工具）+ 浏览器 SDK。
      # 纯 JS 资源，由 BrowserUseInstaller 装进 support 目录后交给引擎 spawn。
      # type: folder —— 必须是目录引用：普通资源会被拷到 Resources 根下摊平，
      # 安装器按目录整体复制就找不到它们了。
      - path: BrowserUse
        type: folder
        buildPhase: resources
      # 随包引擎版本引脚：直接拷入 bundle（不复制版本值，避免第二份事实源）。
      # 版本门要用它在「未嵌入引擎」的构建里也能读出 pin（SPEC-ENGINE-RUNTIME §3.4）。
      - path: ../../scripts/dsh-runtime-version.txt
        buildPhase: resources
    dependencies:
      # Sparkle 作为 app target 的直接 SPM 依赖：Xcode 会把它嵌进
      # Contents/Frameworks（sign-app.sh 的分发档随后逐个重签，见该脚本）。
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdive.app
        PRODUCT_NAME: DeepDive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleName: DeepDive
        CFBundleDisplayName: DeepDive
        CFBundleIdentifier: com.deepdive.app
        CFBundleVersion: "0.1.5"
        CFBundleShortVersionString: "0.1.5"
        LSUIElement: false
        NSHumanReadableCopyright: "MIT"
        NSHighResolutionCapable: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # 侧栏浏览器（第二个 WKWebView）要能加载 http:// 公网站点；只放宽 Web 内容
          NSAllowsArbitraryLoadsInWebContent: true
        NSMicrophoneUsageDescription: "听写与网页（音视频通话）需要使用麦克风。"
        NSCameraUsageDescription: "网页（视频通话、拍照上传）需要使用摄像头。"
        NSSpeechRecognitionUsageDescription: "听写使用系统语音识别将你的语音转换为文字。"
        # ── 应用自身更新（Sparkle）──
        # feed 指向公开发布仓的 appcast.xml：`releases/latest/download/<asset>` 这条
        # 永久链接每次发布都换成最新那份，装好的用户永远读它。发布链见
        # scripts/publish-release.sh（签 DMG + 写 appcast + 上传，三件事一起）。
        SUFeedURL: https://github.com/CatSkys/DeepDive-releases/releases/latest/download/appcast.xml
        # EdDSA 公钥：核对下载到的 DMG 用的是不是我们自己签的那一份。私钥在钥匙串
        # （账户 com.deepdive.app，scripts/sparkle-tools.sh 的 generate_keys 生成）。
        SUPublicEDKey: q5T7gNJ4Jf74sLSJjkQVNzPYQnBdTYBS9xvnNOPehwY=
        # 每小时查一次（Sparkle 的最小间隔，与 Atd 同档）：不打断地在后台静默下载，
        # 装好的那一刻起「退出即装」，也可从菜单/设置里立刻装。
        SUScheduledCheckInterval: 3600
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
  DSHminiAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DSHminiApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deepdive.appTests
        # 宿主产物名被 PRODUCT_NAME 覆写为 DeepDive（≠ target 名），显式指向
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DeepDive.app/Contents/MacOS/DeepDive
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  DSHmini:
    build:
      targets:
        DSHminiApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSHminiAppTests
